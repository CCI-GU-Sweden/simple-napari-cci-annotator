name: Test and publish

on:
  push:
    branches:
      - main
      - npe2
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
      - npe2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.os }} • py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install system Qt dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q libglib2.0-0 libgl1 libegl1 libxkbcommon-x11-0 \
            libdbus-1-3 xvfb libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0

      - name: Install napari with Qt backend and testing extras
        run: python -m pip install "napari[qt]" && python -m pip install -e ".[testing]"

      - name: Run tests (Linux – headless via xvfb)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          NAPARI_TESTING: "1"
        run: xvfb-run --auto-servernum python -m pytest tests/ -v

      - name: Run tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: python -m pytest tests/ -v

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare release version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            git fetch origin main --quiet
            if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="$(python scripts/next_release_version.py)"
            git tag "v${version}"
            echo "from_main=true" >> "$GITHUB_OUTPUT"
          else
            version="${GITHUB_REF_NAME#v}"
            echo "from_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build package
        if: steps.release.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build .
          python -m twine check dist/*
          test -f "dist/simple_napari_cci_annotator-${{ steps.release.outputs.version }}-py3-none-any.whl"
          test -f "dist/simple_napari_cci_annotator-${{ steps.release.outputs.version }}.tar.gz"
      - name: Push release tag
        if: steps.release.outputs.ready == 'true'
        id: push_tag
        shell: bash
        run: |
          if [[ "${{ steps.release.outputs.from_main }}" == "true" ]]; then
            git fetch origin main --quiet
            if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git push origin "refs/tags/v${{ steps.release.outputs.version }}"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI
        if: steps.push_tag.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
